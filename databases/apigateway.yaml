apiVersion: apps/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: apigateway:1.0
          env:
            - name: ORDER_SERVICE_URI
              value: "http://order-service:8084"
            - name: AUTH_SERVICE_URI
              value: "http://auth-service:8082"
            - name: USER_SERVICE_URI
              value: "http://user-service:8080"
            - name: PAYMENT_SERVICE_URI
              value: "http://payment-service:8088"
          ports:
            - containerPort: 8068
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8068}
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8068}
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
spec:
  selector:
    app: apigateway
  ports:
    - port: 8068
      targetPort: 8068
