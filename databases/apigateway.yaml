apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
spec:
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: apigateway:1.0
          env:
            - name: USER_SERVICE_URI
              value: "http://user-service:8085"
            - name: ORDER_SERVICE_URI
              value: "http://order-service:8082"
          ports:
            - containerPort: 8068
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
spec:
  selector:
    app: apigateway
  ports:
    - port: 8068
      targetPort: 8068
