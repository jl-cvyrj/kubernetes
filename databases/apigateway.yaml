apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: microservice-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: apigateway:1.0
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 8068
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8068}
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8068}
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: microservice-app
spec:
  selector:
    app: apigateway
  ports:
    - port: 8068
      targetPort: 8068
