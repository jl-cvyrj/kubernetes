apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microservice-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:1.0
          ports:
            - containerPort: 8082
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8082}
            initialDelaySeconds: 20
            periodSeconds: 5
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: AUTH_DB_USERNAME
              valueFrom: {secretKeyRef: {name: app-secrets, key: AUTH_DB_USERNAME}}
            - name: AUTH_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: AUTH_DB_PASSWORD}}
            - name: SPRING_DATASOURCE_URL
              valueFrom: {secretKeyRef: {name: app-secrets, key: AUTH_DB_URL}}
