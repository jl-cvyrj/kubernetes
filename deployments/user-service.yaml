apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:1.0
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 5
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: app-secrets, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: DB_PASSWORD}}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/user_db"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {secretKeyRef: {name: app-secrets, key: KAFKA_URL}}
