apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservice-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:1.0
        ports:
        - containerPort: 8084
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8084}
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8084}
          initialDelaySeconds: 20
          periodSeconds: 5
        envFrom:
        - configMapRef: {name: app-config}
        env:
        - name: DB_USERNAME
          valueFrom: {secretKeyRef: {name: app-secrets, key: DB_USERNAME}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secrets, key: DB_PASSWORD}}
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/order_db"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom: {secretKeyRef: {name: app-secrets, key: KAFKA_URL}}
